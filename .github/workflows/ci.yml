name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: |
        cd backend
        uv sync --frozen

    - name: Lint with Ruff
      run: |
        cd backend
        uv run ruff check .

    - name: Check syntax
      run: |
        cd backend
        uv run python -m compileall app

    - name: Create test .env
      working-directory: ./backend
      run: |
        echo "ENV=local" > .env
        echo "DATABASE_URL=postgresql+asyncpg://test:test@localhost:5432/test" >> .env
        echo "SECRET_KEY=test-secret-key-for-ci-only" >> .env
        echo "ACCESS_TOKEN_EXPIRE_MINUTES=1440" >> .env
        echo "CORS_ORIGINS=http://localhost:5173" >> .env
        
    - name: Run tests
      working-directory: ./backend
      run: uv run pytest -v