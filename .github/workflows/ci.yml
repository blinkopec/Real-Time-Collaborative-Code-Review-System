name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: |
        cd backend
        uv sync --frozen

    - name: Lint with Ruff
      run: |
        cd backend
        uv run ruff check .

    - name: Check syntax
      run: |
        cd backend
        uv run python -m compileall app